services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        container_name: molitorhu
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - webproxy
        depends_on: {}
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=webproxy"
            - "traefik.http.routers.molitorhu.entrypoints=websecure"
            - "traefik.http.routers.molitorhu.rule=Host(`molitor.hu`) || Host(`www.molitor.hu`)"
            - "traefik.http.routers.molitorhu.tls.certresolver=myresolver"
            - "traefik.http.services.molitorhu.loadbalancer.server.port=80"
            - "traefik.http.routers.molitorhu-http.entrypoints=web"
            - "traefik.http.routers.molitorhu-http.rule=Host(`molitor.hu`) || Host(`www.molitor.hu`)"
            - "traefik.http.routers.molitorhu-http.middlewares=redirect-to-https"
networks:
    sail:
        driver: bridge
    webproxy:
        external: true